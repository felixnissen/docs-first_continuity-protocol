name: conformance

on:
  pull_request:
  push:
    branches:
      - contrib/**

permissions:
  contents: read

jobs:
  validator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run validator tests
        run: npm test

      - name: Self-validate repository
        run: npm run validate

      - name: Verify machine-readable report
        shell: bash
        run: |
          node conformance/cli.mjs . --format json > conformance-report.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('conformance-report.json','utf8')); if(r.reportVersion!==1||!Array.isArray(r.results)||r.results.length!==18) process.exit(1);"

      - name: Diff check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
